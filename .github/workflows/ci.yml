name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Bundle client không chứa khóa server
        run: |
          if grep -rqE "service_role|SUPABASE_SERVICE_ROLE_KEY|IP_HASH_SECRET|sb_secret_" .next/static; then
            echo "Tìm thấy chuỗi khóa server trong bundle client"; exit 1
          fi
